# 歩掛JSONテストケース生成パイプライン 業務知識ルール
#
# 設計方針 (重要):
#   JSON だけからは取れない「業務概念のラベル / 業務的振る舞い」のみを記述する。
#   ロジックで判定できる事項 (フロー解析・AutoSelectJoken評価・差分検出 等) は
#   yaml には書かず、エンジン側で自動処理する。
#
#   yaml への追加判断は必ず人間に確認する(無闇な追加でシステマチック生成を曇らせない)。
#
# バージョン履歴:
#   v3 (2026-05-28): 初版。expected_value_policy / scenario_policy / axis_behaviors。
#                     32-4527 で「資材計上区分」を vary 昇格させるため axis_behaviors を導入。

version: 3

# ===================================================================
# 1. 期待値ポリシー
#    具体的な数値で確認するか「変化があることだけ確認」するかの判定方針
# ===================================================================
expected_value_policy:
  # 基本: JSON.DaikaItemLine の単価DB参照(TankaCD≠"0-0-0-0-0")から
  #       外部単価依存をエンジンが自動検出 → 該当行は「変化があること」止まり
  # 自動検出で漏れたケースのみここに列挙(初期は空)
  change_only_overrides: []

# ===================================================================
# 2. シナリオ生成方針
#    step2 提案リスト → step3 テストケースCSV の変換ルール
# ===================================================================
scenario_policy:
  # カテゴリ別グループ化ルール(step2→step3 で TC をどう束ねるか)
  grouping:
    代価表:   per_change       # 1変更=1TC
    計算表:   all_together     # 全件まとめて1TC
    質問設定: all_together     # 全件まとめて1TC
    選択肢:   per_test_axis    # テスト軸(質問)単位で1TC
    質問:    per_change_type  # 追加/変更/削除別 最大3件
    フロー:   per_change_type  # 追加/変更/削除別 最大3件
    回帰:    by_axis_dedup    # 同テスト軸の重複を排除

  # カテゴリ別確認方法(CSVの「確認方法」列)
  verification_method:
    代価表:   目視確認
    計算表:   計算値確認
    質問設定: 計算値確認
    選択肢:   目視確認
    質問:    目視確認
    フロー:   フロー遷移確認
    回帰:    計算値確認

# ===================================================================
# 3. 軸の特殊な業務的振る舞い
#    JSON 構造からは導出できない「軸の業務上の意味」を持つもののみ列挙
#    エンジンはこのルールを参照して vary 昇格判定等を行う
# ===================================================================
axis_behaviors:
  - axis_name: "資材計上区分"
    role: material_inclusion_toggle
    description: |
      代価表に材料計上行を出すか出さないかを切り替えるトグル軸。
      この軸の選択により代価表行の表示有無が変わるため、
      代価表数量(S1〜S5等)に関わる計算式変更があった場合は、
      両側の値で確認するため vary に昇格する。
    promote_to_vary_when:
      # 検出ロジック (エンジン側で実装):
      # 1. JSON にこの軸名 (SitsumonItem.Mesho) が存在する
      # 2. 差分に 計算表 (KeisanItem) 変更がある
      # 3. この軸の選択可能な行を切替えて flow_walker を走らせると
      #    S1〜S5 のいずれかの値が変わる(=代価表数量への影響あり)
      condition: change_affects_suryo_via_axis_switch

# ===================================================================
# yaml に書かないもの (=エンジンが処理)
# ===================================================================
# - 質問・選択肢の表示テキスト → JSON.SitsumonItem.Mesho / SitTabCells
# - 変数の業務カテゴリ(労務/機械/材料) → シナリオテストに不要
# - SFK系・省庁マスタ → シナリオテストに登場しない
# - AutoSelectJoken・ExecJoken・フロー遷移 → エンジン自動処理 (flow_walker)
# - 外部単価依存の判定 → エンジンが JSON から自動検出
# - Expression評価 → エンジンが Being.Core.Expressions 移植コードで処理
