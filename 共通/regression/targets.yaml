# 回帰テスト対象レジストリ
# 合格工種が増えたらここにエントリを追加し、
#   python3 共通/regression/run_regression.py --update-baseline <id>
# でベースラインを取得する(それだけで回帰対象になる)。
#
# mode:
#   diff : 差分起点モード (pipeline.py old new output)
#   new  : 新規工種モード (generate_proposals_new.py + generate_csv.py、step1系なし)

baseline_name: pre_J2
baseline_root: 進捗報告/regression_baseline
report_path: 進捗報告/regression_report_最新.md

default_steps_diff:
  - step1.0_差分レポート.csv
  - step1.5_乖離チェック.csv
  - step2.0_テスト計画.csv
  - step3.0_テストケース.csv
default_steps_new:
  - step2.0_テスト計画.csv
  - step3.0_テストケース.csv

